
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuando tengas un día difícil ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff3e0, #ffe8e8, #e8f0ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #514b4b;
        }

        .carta {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #d8894a;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #d8894a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>🌧️ Cuando tengas un día difícil</h1>

    <p>
        Sé que hay días que pueden sentirse demasiado pesados.
        Si hoy es uno de esos días, quiero que vayas despacio.
    </p>

    <p>
        No tienes que tener todas las respuestas ahora mismo.
        Paso a paso, todo puede mejorar.
    </p>

    <p>
        Y recuerda que yo creo en ti y estoy contigo. ❤️
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
