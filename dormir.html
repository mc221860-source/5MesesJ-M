
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes de dormir ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dfe7ff, #eee3ff, #ffe7f1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #48465c;
        }

        .carta {
            background: rgba(255,255,255,0.93);
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #6978c8;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #6978c8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>🌙 Cuando vayas a dormir</h1>

    <p>
        Antes de dormir quiero que recuerdes que eres una de las personas
        más especiales de mi vida.
    </p>

    <p>
        Espero que descanses muchísimo y que tengas una noche tranquila.
    </p>

    <p>
        Buenas noches, mi amor. Sueña bonito. ❤️🌙
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
