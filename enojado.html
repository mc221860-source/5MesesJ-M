
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuando estés enojado ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1e6, #ffe1e1, #fff8e7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #574747;
        }

        .carta {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e76f51;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #e99076;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>😤 Cuando estés enojado</h1>

    <p>
        Respira un poquito y date tiempo para sentir lo que estás sintiendo.
    </p>

    <p>
        No tienes que resolver todo inmediatamente. A veces simplemente
        necesitamos parar, respirar y dejar que las cosas se calmen.
    </p>

    <p>
        Y recuerda que te amo incluso en los días difíciles. ❤️
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
