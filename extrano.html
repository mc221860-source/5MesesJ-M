

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuando me extrañes ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9ddff, #ffe4f0, #e1f5ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #51465b;
        }

        .carta {
            background: rgba(255,255,255,0.93);
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #a66dd4;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #a66dd4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>🥹 Cuando me extrañes</h1>

    <p>
        Si me estás extrañando, quiero que recuerdes todos los momentos
        bonitos que hemos compartido.
    </p>

    <p>
        Aunque ahora no estemos juntos físicamente, siempre llevas un
        pedacito de mi corazón contigo.
    </p>

    <p>
        Y pronto volveremos a estar juntitos. ❤️
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
