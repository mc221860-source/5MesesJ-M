
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuando te sientas solo ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e1f5ff, #e8e4ff, #fff0f5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #46515a;
        }

        .carta {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #5b9bd5;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #5b9bd5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>🫂 Cuando te sientas solo</h1>

    <p>
        Si en algún momento sientes que estás solo, recuerda que tienes
        a alguien que te quiere muchísimo.
    </p>

    <p>
        Yo estoy aquí para ti, incluso cuando no pueda estar físicamente
        a tu lado.
    </p>

    <p>
        Nunca olvides lo importante que eres para mí. ❤️
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
