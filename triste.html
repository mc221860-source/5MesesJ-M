
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuando estés triste ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f8e8ff, #fff0f5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #4d4655;
        }

        .carta {
            background: rgba(255,255,255,0.92);
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #8b78d8;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
        }

        .volver {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #9b8bea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .volver:hover {
            transform: scale(1.05);
            background: #806fd0;
        }
    </style>
</head>

<body>

<div class="carta">
    <h1>🥺 Cuando estés triste</h1>

    <p>
        Si hoy no estás teniendo un buen día, quiero que recuerdes que
        no tienes que enfrentarlo todo solo.
    </p>

    <p>
        Aunque no pueda solucionar todo lo que te pasa, siempre voy a
        querer escucharte, acompañarte y hacerte sentir un poquito mejor.
    </p>

    <p>
        Te quiero muchísimo y aquí estoy para ti. ❤️
    </p>

    <button class="volver" onclick="window.location.href='index.html#cartas'">
        💌 Volver a Ábreme cuando...
    </button>
</div>

</body>
</html>
